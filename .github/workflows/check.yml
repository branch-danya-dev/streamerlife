name: Luau checks and Roblox build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip -o /tmp/luau.zip
          curl --fail --location --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo.zip
          curl --fail --location --retry 3 https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip -o /tmp/stylua.zip
          unzip -q /tmp/luau.zip -d .tools
          unzip -q /tmp/rojo.zip -d .tools
          unzip -q /tmp/stylua.zip -d .tools
          chmod +x .tools/*
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Test pure gameplay and persistence logic
        run: luau tests/domain.spec.luau
      - name: Analyze portable modules
        run: luau-analyze src/shared tests/domain.spec.luau
      - name: Formatting and compilation
        run: |
          stylua --check src tests
          find src tests -name '*.luau' -print0 | xargs -0 -n1 luau-compile --null
      - name: Build both places
        run: |
          mkdir -p build
          rojo build default.project.json -o build/StreamerLife.rbxlx
          rojo build tests/studio.project.json -o build/StreamerLife-QA.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: StreamerLife-Studio
          path: build/*.rbxlx
